[package]
name = "camshaft"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "A Solana sBPF virtual machine you can see inside: run, trace and profile programs, with the same results as Agave"
license = "GPL-2.0-or-later"
repository = "https://github.com/simplysabir/camshaft"
readme = "README.md"
keywords = ["solana", "sbpf", "ebpf", "virtual-machine", "profiler"]
categories = ["command-line-utilities", "development-tools::debugging", "development-tools::profiling", "emulators"]
# Test programs and fixtures stay in the repository; the crate ships the code and guides.
include = ["/src/**/*", "/docs/*.md", "/README.md", "/LICENSE"]

[dependencies]
base64 = "0.23.1"
bs58 = "0.5.1"
clap = { version = "4.6.9", features = ["derive"] }
curve25519-dalek = "4"
rustc-demangle = "0.1.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
thiserror = "2.0.21"

[dev-dependencies]
mollusk-svm = "=0.17.1"
proptest = "1.12.0"
solana-account = "5.4.0"
solana-clock = "4.0.0"
solana-instruction = "4.0.0"
solana-pubkey = "4.4.0"
solana-rent = "4.5.0"
solana-sbpf = { version = "0.28.0", features = ["dev-context-only-utils"] }
solana-svm-feature-set = "=4.4.1"
solana-svm-log-collector = "=4.4.1"

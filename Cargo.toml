[package]
name = "camshaft"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
base64 = "0.23.1"
bs58 = "0.5.1"
clap = { version = "4.6.9", features = ["derive"] }
curve25519-dalek = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
thiserror = "2.0.21"

[dev-dependencies]
mollusk-svm = "=0.17.1"
proptest = "1.12.0"
solana-account = "5.4.0"
solana-clock = "4.0.0"
solana-instruction = "4.0.0"
solana-pubkey = "4.4.0"
solana-rent = "4.5.0"
solana-sbpf = { version = "0.28.0", features = ["dev-context-only-utils"] }
solana-svm-feature-set = "=4.4.1"
solana-svm-log-collector = "=4.4.1"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="How camshaft runs a program">
  <title>How camshaft runs a program</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1280" height="560" rx="20" fill="#0d1117"/>
  <rect x="40" y="60" width="190" height="140" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="60" width="4" height="140" rx="2" fill="#8b949e"/><text x="56" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">program.so</text><text x="56" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">v0 or v3 ELF</text><text x="56" y="140" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">+ fixture.json</text><text x="56" y="162" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">accounts, data</text><rect x="290" y="60" width="200" height="140" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="290" y="60" width="4" height="140" rx="2" fill="#f5a524"/><text x="306" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Loader</text><text x="306" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">e_flags picks v0 / v3</text><text x="306" y="140" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">relocate, lay out</text><text x="306" y="162" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">read-only data</text><rect x="550" y="60" width="180" height="140" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="550" y="60" width="4" height="140" rx="2" fill="#f5a524"/><text x="566" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Verifier</text><text x="566" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">opcodes, registers</text><text x="566" y="140" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">jump targets</text><text x="566" y="162" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">lddw pairs</text><rect x="790" y="40" width="450" height="300" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="790" y="40" width="4" height="300" rx="2" fill="#2dd4bf"/><text x="806" y="72" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Virtual machine</text><rect x="814" y="96" width="196" height="98" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="814" y="96" width="4" height="98" rx="2" fill="#2dd4bf"/><text x="830" y="128" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Interpreter</text><text x="830" y="154" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">decode, execute</text><text x="830" y="176" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">calls, stack frames</text><rect x="1024" y="96" width="196" height="98" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="1024" y="96" width="4" height="98" rx="2" fill="#2dd4bf"/><text x="1040" y="128" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Memory map</text><text x="1040" y="154" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">4 regions, bounds</text><text x="1040" y="176" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">and write checks</text><rect x="814" y="214" width="196" height="98" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="814" y="214" width="4" height="98" rx="2" fill="#2dd4bf"/><text x="830" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Syscalls</text><text x="830" y="272" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">logging, memory, hashes</text><text x="830" y="294" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">PDAs, sysvars, return</text><rect x="1024" y="214" width="196" height="98" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="1024" y="214" width="4" height="98" rx="2" fill="#2dd4bf"/><text x="1040" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Compute meter</text><text x="1040" y="272" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">1 CU per instruction</text><text x="1040" y="294" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">+ each syscall's cost</text><rect x="290" y="260" width="440" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="290" y="260" width="4" height="120" rx="2" fill="#f5a524"/><text x="306" y="292" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Runtime</text><text x="306" y="318" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">serialize accounts into the input region, run,</text><text x="306" y="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">check every account change, write Agave's log lines</text><rect x="790" y="400" width="450" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="790" y="400" width="4" height="120" rx="2" fill="#f5a524"/><text x="806" y="432" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Observers</text><text x="806" y="458" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">trace: one line per instruction</text><text x="806" y="480" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">profile: compute units per function, flame graphs</text><rect x="40" y="400" width="690" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="40" y="400" width="4" height="120" rx="2" fill="#8b949e"/><text x="56" y="432" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Outcome</text><text x="56" y="458" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">result, logs, compute units, final accounts, return data</text><text x="56" y="480" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">the same bytes Agave 4.4.1 produces, checked in tests</text>
